[package]
name = "palmcode-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
palmcode-agent = { path = "../agent" }
palmcode-llm = { path = "../llm" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[[bin]]
name = "palmcode-bench"
path = "src/main.rs"

[[bin]]
name = "edit-bench"
path = "src/bin/edit_bench.rs"
