[package]
name = "palmcode-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "palmcode_ffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
palmcode-agent = { path = "../agent" }
palmcode-llm = { path = "../llm" }
thiserror = "2"
uniffi = "0.32.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
rustls-platform-verifier = "0.6"

[features]
# Bindgen CLI: used by the Gradle build to generate Kotlin bindings after
# the cdylib is compiled.
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]
