name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (pinned, mirrors rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install SDK components (pinned versions; SDK is preinstalled on ubuntu-24.04)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370"
      - name: Rust toolchain (pinned, mirrors rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: aarch64-linux-android, x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk@4.1.2
      - name: Assemble
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
