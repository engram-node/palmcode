name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (pinned, mirrors rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install SDK components (pinned versions; SDK is preinstalled on ubuntu-24.04)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370"
      - name: Rust toolchain (pinned, mirrors rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: aarch64-linux-android, x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk@4.1.2
      - name: Assemble
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # Reproducibility: build the unsigned release APK twice from scratch and
  # compare. APKs are unsigned (F-Droid signs later), so there is no
  # signature block to strip — equality must be byte-exact.
  repro:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install SDK components (pinned versions)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370"
      - name: Rust toolchain (pinned, mirrors rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: aarch64-linux-android, x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk@4.1.2
      - name: Build 1
        run: |
          ./gradlew --no-daemon assembleRelease
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/apk1.apk
      - name: Build 2 (clean)
        run: |
          ./gradlew --no-daemon clean assembleRelease
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/apk2.apk
      - name: Compare
        run: |
          sha256sum /tmp/apk1.apk /tmp/apk2.apk
          if cmp -s /tmp/apk1.apk /tmp/apk2.apk; then
            echo "DETERMINISTIC: release APK builds byte-identical" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### WARNING: release APK is NOT byte-reproducible"
              echo '```'
              mkdir -p /tmp/a1 /tmp/a2
              (cd /tmp/a1 && unzip -qa /tmp/apk1.apk)
              (cd /tmp/a2 && unzip -qa /tmp/apk2.apk)
              (cd /tmp/a1 && find . -type f | sort | xargs sha256sum) > /tmp/h1
              (cd /tmp/a2 && find . -type f | sort | xargs sha256sum) > /tmp/h2
              diff /tmp/h1 /tmp/h2 || true
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
