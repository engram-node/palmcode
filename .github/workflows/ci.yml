name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (pinned, mirrors rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install SDK components (pinned versions; SDK is preinstalled on ubuntu-24.04)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370"
      - name: Rust toolchain (pinned, mirrors rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: aarch64-linux-android, x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk@4.1.2
      - name: Assemble
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # Reproducibility: build the unsigned release APK twice in DIFFERENT
  # dirs with different HOME/GRADLE_USER_HOME, --remap-path-prefix active
  # for the Rust side. APKs are unsigned (F-Droid signs later), so there is
  # no signature block to strip — equality must be byte-exact.
  repro:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install SDK components (pinned versions)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370"
      - name: Rust toolchain (pinned, mirrors rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: aarch64-linux-android, x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk@4.1.2
      - uses: actions/checkout@v4
        with:
          path: build-one
      - uses: actions/checkout@v4
        with:
          path: build-two
      - name: Build 1 (dir build-one, HOME=/tmp/home1)
        run: |
          export HOME=/tmp/home1 GRADLE_USER_HOME=/tmp/home1/.gradle
          mkdir -p "$HOME"
          cd build-one
          export RUSTFLAGS="--remap-path-prefix=$PWD=build"
          ./gradlew --no-daemon assembleRelease
          sha256sum android/app/build/outputs/apk/release/*.apk | tee /tmp/hashes1.txt
      - name: Build 2 (dir build-two, HOME=/tmp/home2)
        run: |
          export HOME=/tmp/home2 GRADLE_USER_HOME=/tmp/home2/.gradle
          mkdir -p "$HOME"
          cd build-two
          export RUSTFLAGS="--remap-path-prefix=$PWD=build"
          ./gradlew --no-daemon assembleRelease
          sha256sum android/app/build/outputs/apk/release/*.apk | tee /tmp/hashes2.txt
      - name: Compare
        run: |
          fail=0
          for apk in build-one/android/app/build/outputs/apk/release/*.apk; do
            name=$(basename "$apk")
            other="build-two/android/app/build/outputs/apk/release/$name"
            if cmp -s "$apk" "$other"; then
              echo "DETERMINISTIC: $name" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "### WARNING: $name NOT byte-reproducible" | tee -a "$GITHUB_STEP_SUMMARY"
              mkdir -p "/tmp/cmp/$name.a" "/tmp/cmp/$name.b"
              (cd "/tmp/cmp/$name.a" && unzip -qa "$OLDPWD/$apk")
              (cd "/tmp/cmp/$name.b" && unzip -qa "$OLDPWD/$other")
              (cd "/tmp/cmp/$name.a" && find . -type f | sort | xargs sha256sum) > /tmp/cmp/h1
              (cd "/tmp/cmp/$name.b" && find . -type f | sort | xargs sha256sum) > /tmp/cmp/h2
              { echo '```'; diff /tmp/cmp/h1 /tmp/cmp/h2 || true; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
          done
          exit $fail
