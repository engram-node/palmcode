AutoName: pocket
Summary: On-device coding agent; your keys, your models, your data stays local
Description: |
    pocket is a coding-agent harness that runs entirely on your phone. Point it
    at any OpenAI-compatible endpoint (OpenAI, OpenRouter, DeepSeek, a local
    llama.cpp/vLLM/Ollama server, ...) with your own API key. Sessions, repos,
    files, shell execution, and keys never leave the device. No accounts, no
    telemetry, no crash reporting.

