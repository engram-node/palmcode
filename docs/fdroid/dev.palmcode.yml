# Draft fdroiddata metadata for dev.palmcode.
# NOT validated with fdroidserver yet — finalized in M5 once the userland
# build exists (srclib-free: everything is built in-tree from pinned sources).
#
# Vendoring note: core/vendor/ is committed (~65 MB working tree). This ships
# the full Rust dependency closure IN the repo (byte-exact via .gitattributes
# -text). Alternatives considered: (a) F-Droid prebuild downloading crates —
# needs network trust + crates.io availability in the build VM; (b) cargo
# vendor as a CI-released tarball — same, plus an artifact to host. Committed
# vendor wins on determinism + offline builds; cost is repo size and the
# "no binaries in repo" discipline applying only to OUR binaries (vendored
# source fixtures remain, e.g. askama_parser tests/*.bin — upstream data,
# documented).

